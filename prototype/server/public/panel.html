<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PULSAR · Server Control</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --panel: #141417;
      --line: #2e2e32;
      --text: #fff;
      --muted: #a3a3a8;
      --dim: #6f6f75;
      --red: #f64137;
      --blue: #288bff;
      --green: #3ddc84;
      --yellow: #ffbe2e;
      --mono: ui-monospace, "DM Mono", Consolas, monospace;
      --sans: Inter, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font: 14px/1.45 var(--sans);
      color: var(--text);
      background: var(--bg);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: #000;
    }
    header h1 {
      font-size: 15px;
      letter-spacing: 0.28em;
      font-weight: 700;
    }
    header p {
      margin-top: 4px;
      color: var(--muted);
      font: 11px/1.4 var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .meta {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      color: var(--dim);
      font: 11px/1 var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .meta strong { color: var(--text); font-weight: 500; }
    .ok { color: var(--green); }
    .bad { color: var(--red); }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    button, select, input {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 9px 12px;
    }
    button {
      cursor: pointer;
      font: 11px/1 var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    button:hover { border-color: #fff; }
    button.primary {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    button.danger { color: var(--red); border-color: var(--red); }
    button.on {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }
    .grid {
      display: grid;
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }
    .card {
      background: var(--panel);
      padding: 18px;
      display: grid;
      gap: 14px;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .card-head h2 {
      font-size: 20px;
      letter-spacing: -0.01em;
    }
    .card-head .id {
      color: var(--dim);
      font: 11px/1.4 var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border: 1px solid currentColor;
      border-radius: 99rem;
      font: 10px/1 var(--mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .pill.online { color: var(--green); }
    .pill.offline { color: var(--dim); }
    .pill.sim { color: var(--blue); }
    .pill.critical { color: var(--red); }
    .pill.warning { color: var(--yellow); }
    .pill.normal { color: var(--green); }
    .pill.pending { color: var(--dim); }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 12px 0;
    }
    .metrics span {
      display: block;
      color: var(--dim);
      font: 10px/1 var(--mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .metrics strong {
      font: 22px/1 var(--mono);
      font-weight: 400;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .row label {
      color: var(--muted);
      font: 10px/1 var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      width: 100%;
    }
    .row input { flex: 1; min-width: 140px; }
    .hint {
      color: var(--dim);
      font-size: 12px;
    }
    .empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
    }
    details.block {
      border: 1px solid var(--line);
      padding: 10px 12px;
      background: #101014;
    }
    details.block > summary {
      cursor: pointer;
      font: 11px/1 var(--mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      list-style: none;
    }
    details.block > summary::-webkit-details-marker { display: none; }
    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .fields label {
      display: grid;
      gap: 4px;
      color: var(--dim);
      font: 10px/1 var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .fields input, .fields select, .fields textarea {
      width: 100%;
      padding: 8px;
    }
    .fields textarea { min-height: 64px; resize: vertical; }
    @media (max-width: 720px) {
      .metrics { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>PULSAR</h1>
      <p>Server control panel · not the crew site</p>
    </div>
    <div class="meta" id="meta">
      <span>loading…</span>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <button class="primary" id="btn-refresh">Refresh</button>
      <button class="danger" id="btn-stop-all">Stop all sims</button>
      <button class="danger" id="btn-reset-all" title="Stop sims and clear saved profile/Hz">Reset sim settings</button>
      <span class="hint">Profile/Hz stay until you Reset · Crew UI: http://127.0.0.1:4200</span>
    </div>
    <div class="grid" id="devices"></div>
  </main>

  <script>
    const API = location.origin;
    /** Локальні чернетки полів — не затираються автооновленням */
    const drafts = new Map();

    async function api(path, opts) {
      const res = await fetch(API + path, {
        cache: "no-store",
        headers: { "Content-Type": "application/json" },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function esc(v) {
      return String(v ?? "—")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function statusPill(d) {
      if (d.simulating) return `<span class="pill sim">Sim · ${esc(d.sim?.profile || "on")}</span>`;
      if (!d.connected) return `<span class="pill offline">Offline</span>`;
      return `<span class="pill ${esc(d.status || "pending")}">${esc(d.status || "pending")}</span>`;
    }

    function captureDraft(cardEl) {
      if (!cardEl?.dataset?.id) return;
      const active = document.activeElement;
      const editing = cardEl.contains(active) &&
        (active.matches("input, select, textarea") || active.isContentEditable);
      drafts.set(cardEl.dataset.id, {
        profile: cardEl.querySelector(".inp-profile")?.value,
        hz: cardEl.querySelector(".inp-hz")?.value,
        label: cardEl.querySelector(".inp-label")?.value,
        role: cardEl.querySelector(".inp-role")?.value,
        editing,
      });
    }

    function captureAllDrafts() {
      document.querySelectorAll("#devices .card[data-id]").forEach(captureDraft);
    }

    function fieldValues(d) {
      const draft = drafts.get(d.id);
      // Поки користувач редагує — тримаємо його значення; інакше беремо збережені з сервера
      if (draft?.editing) {
        return {
          profile: draft.profile || d.sim?.profile || "normal",
          hz: draft.hz || d.sim?.hz || 1,
          label: draft.label ?? (d.label || d.device_no),
          role: draft.role ?? d.role,
        };
      }
      return {
        profile: d.sim?.profile || draft?.profile || "normal",
        hz: d.sim?.hz || draft?.hz || 1,
        label: d.label || d.device_no,
        role: d.role,
      };
    }

    function card(d) {
      const profiles = ["normal", "rest", "warning", "critical"];
      const f = fieldValues(d);
      const profileOpts = profiles
        .map((p) => `<option value="${p}" ${f.profile === p ? "selected" : ""}>${p}</option>`)
        .join("");
      return `
        <article class="card" data-id="${esc(d.id)}">
          <div class="card-head">
            <div>
              <h2 class="js-title">${esc(d.label || d.device_no)}</h2>
              <div class="id js-idline">${esc(d.id)} · ${esc(d.device_no)} · ${esc(d.role)}</div>
            </div>
            <div class="row js-pills" style="justify-content:flex-end">
              ${statusPill(d)}
              <span class="pill ${d.connected ? "online" : "offline"}">${d.connected ? "Link" : "No link"}</span>
            </div>
          </div>

          <div class="metrics">
            <div><span>HR</span><strong class="js-hr">${d.hr == null ? "—" : esc(d.hr)}</strong></div>
            <div><span>SpO₂</span><strong class="js-spo2">${d.spo2 == null ? "—" : esc(d.spo2)}</strong></div>
            <div><span>Temp</span><strong class="js-temp">${d.temp == null ? "—" : esc(d.temp)}</strong></div>
            <div><span>Battery</span><strong class="js-bat">${d.battery == null ? "—" : esc(d.battery) + "%"}</strong></div>
          </div>

          <div class="row">
            <label>Rename (display name)</label>
            <input type="text" class="inp-label" value="${esc(f.label)}" maxlength="64">
            <button data-act="rename">Save name</button>
          </div>

          <div class="row">
            <label>Role</label>
            <input type="text" class="inp-role" value="${esc(f.role)}" maxlength="64">
            <button data-act="role">Save role</button>
          </div>

          <div class="row">
            <label>Simulation (saved until Reset)</label>
            <select class="inp-profile">${profileOpts}</select>
            <input class="inp-hz" type="number" min="0.2" max="5" step="0.2" value="${esc(f.hz)}" title="Hz" style="width:72px">
            <button class="${d.simulating ? "on" : ""}" data-act="sim-toggle">
              ${d.simulating ? "Stop sim" : "Start sim"}
            </button>
            <button data-act="clear">Clear ring</button>
            <button class="danger" data-act="sim-reset">Reset sim</button>
            <button class="danger" data-act="sos-off" ${d.sos ? "" : "disabled"}>Clear SOS</button>
          </div>

          <details class="block" open>
            <summary>Emulate site metrics (force values → crew UI)</summary>
            <div class="fields">
              ${metricField("hr", "HR bpm", d.overrides?.hr ?? d.hr)}
              ${metricField("spo2", "SpO₂ %", d.overrides?.spo2 ?? d.spo2)}
              ${metricField("temp", "Skin °C", d.overrides?.temp ?? d.temp)}
              ${metricField("battery", "Battery %", d.overrides?.battery ?? d.battery)}
              ${metricField("mass", "Mass kg", d.overrides?.mass ?? d.mass)}
              ${metricField("gripStrength", "Grip N", d.overrides?.gripStrength ?? d.gripStrength)}
              ${metricField("acceleration", "Accel", d.overrides?.acceleration ?? d.acceleration)}
              ${metricField("movement", "Movement", d.overrides?.movement ?? d.movement, "text")}
              ${metricField("activity", "Activity", d.overrides?.activity ?? d.activity, "text")}
              ${metricField("pressure", "Pressure kPa", d.overrides?.pressure ?? d.pressure)}
              ${metricField("airTemperature", "Air K", d.overrides?.airTemperature ?? d.airTemperature)}
              ${metricField("airOxygen", "Air O₂ %", d.overrides?.airOxygen ?? d.airOxygen)}
              ${metricField("airQuality", "Air quality", d.overrides?.airQuality ?? d.airQuality, "text")}
              ${metricField("co2", "CO₂ ppm", d.overrides?.co2 ?? d.co2)}
              ${metricField("radiation", "Rad µSv/h", d.overrides?.radiation ?? d.radiation)}
              ${metricField("radiationDose", "Dose mSv", d.overrides?.radiationDose ?? d.radiationDose)}
              ${metricField("sleepDuration", "Sleep h", d.overrides?.sleepDuration ?? d.sleepDuration)}
              ${metricField("sleepQuality", "Sleep quality", d.overrides?.sleepQuality ?? d.sleepQuality, "text")}
              ${metricField("stressLevel", "Stress 0–10", d.overrides?.stressLevel ?? d.stressLevel)}
            </div>
            <div class="row" style="margin-top:10px">
              <button class="primary" data-act="emulate">Apply emulate</button>
              <button class="danger" data-act="emulate-clear">Clear overrides</button>
              <span class="hint">Empty field = leave auto. Apply keeps override until Clear.</span>
            </div>
          </details>

          <details class="block">
            <summary>Medical card (server-owned)</summary>
            <div class="fields">
              ${metricField("med-name", "Full name", d.medicalCard?.personal?.name || d.label, "text")}
              ${metricField("med-birth", "Birth date", d.medicalCard?.personal?.birthDate || "", "date")}
              ${metricField("med-sex", "Sex", d.medicalCard?.personal?.sex || "", "text")}
              ${metricField("med-blood", "Blood type", d.medicalCard?.personal?.bloodType || "", "text")}
              ${metricField("med-height", "Height cm", d.medicalCard?.physical?.height ?? "", "number")}
              ${metricField("med-mass", "Mass kg", d.medicalCard?.physical?.mass ?? d.mass ?? "", "number")}
              ${metricField("med-pulse", "Baseline HR", d.medicalCard?.physical?.pulse ?? d.baseline?.pulse ?? "", "number")}
              ${metricField("med-spo2", "Baseline SpO₂", d.medicalCard?.physical?.oxygen ?? d.baseline?.oxygen ?? "", "number")}
              ${metricField("med-allergies", "Allergies", d.medicalCard?.medicalHistory?.allergies || "", "text")}
              ${metricField("med-meds", "Medications", d.medicalCard?.medicalHistory?.medications || "", "text")}
              ${metricField("med-notes", "Assessment notes", d.medicalCard?.assessment?.notes || "", "text")}
            </div>
            <div class="row" style="margin-top:10px">
              <button class="primary" data-act="medical">Save medical card</button>
            </div>
          </details>

          <details class="block">
            <summary>Force check-in</summary>
            <div class="fields">
              ${metricField("ci-mood", "Mood", "Neutral", "text")}
              ${metricField("ci-symptoms", "Symptoms / notes", "", "text")}
            </div>
            <div class="row" style="margin-top:10px">
              <button data-act="checkin">Post check-in</button>
            </div>
          </details>

          <p class="hint js-alert">${esc(d.alert || "")}</p>
        </article>`;
    }

    function metricField(key, label, value, type = "number") {
      const v = value == null ? "" : value;
      return `<label>${esc(label)}<input class="emu-${esc(key)}" type="${esc(type)}" value="${esc(v)}" step="any"></label>`;
    }

    /** Оновлення метрик/статусу без перезапису полів, які зараз редагують */
    function patchCard(cardEl, d) {
      const f = fieldValues(d);
      const title = cardEl.querySelector(".js-title");
      const idline = cardEl.querySelector(".js-idline");
      const pills = cardEl.querySelector(".js-pills");
      if (title && !cardEl.querySelector(".inp-label:focus")) {
        title.textContent = d.label || d.device_no;
      }
      if (idline) idline.textContent = `${d.id} · ${d.device_no} · ${d.role}`;
      if (pills) {
        pills.innerHTML = `${statusPill(d)}<span class="pill ${d.connected ? "online" : "offline"}">${d.connected ? "Link" : "No link"}</span>`;
      }
      const hr = cardEl.querySelector(".js-hr");
      const spo2 = cardEl.querySelector(".js-spo2");
      const temp = cardEl.querySelector(".js-temp");
      const bat = cardEl.querySelector(".js-bat");
      if (hr) hr.textContent = d.hr == null ? "—" : d.hr;
      if (spo2) spo2.textContent = d.spo2 == null ? "—" : d.spo2;
      if (temp) temp.textContent = d.temp == null ? "—" : d.temp;
      if (bat) bat.textContent = d.battery == null ? "—" : `${d.battery}%`;
      const alert = cardEl.querySelector(".js-alert");
      if (alert) alert.textContent = d.alert || "";

      const simBtn = cardEl.querySelector('[data-act="sim-toggle"]');
      if (simBtn) {
        simBtn.classList.toggle("on", !!d.simulating);
        simBtn.textContent = d.simulating ? "Stop sim" : "Start sim";
        simBtn.disabled = false;
      }
      const sosBtn = cardEl.querySelector('[data-act="sos-off"]');
      if (sosBtn) sosBtn.disabled = !d.sos;

      // Не чіпаємо інпути під час редагування; інакше підтягуємо збережений серверний профіль
      const editing = cardEl.contains(document.activeElement) &&
        document.activeElement.matches("input, select, textarea");
      if (!editing) {
        const profile = cardEl.querySelector(".inp-profile");
        const hz = cardEl.querySelector(".inp-hz");
        const label = cardEl.querySelector(".inp-label");
        const role = cardEl.querySelector(".inp-role");
        if (profile && profile.value !== String(f.profile)) profile.value = f.profile;
        if (hz && hz.value !== String(f.hz)) hz.value = f.hz;
        if (label && label.value !== String(f.label)) label.value = f.label;
        if (role && role.value !== String(f.role)) role.value = f.role;
      }
    }

    async function load({ full = false } = {}) {
      const data = await api("/api/admin/status");
      const dash = data.dashboard;
      document.getElementById("meta").innerHTML = `
        <span>HTTP <strong>:${esc(data.http)}</strong></span>
        <span>UDP <strong>:${esc(data.udp)}</strong></span>
        <span>Ingest <strong>${esc(data.ingestCount)}</strong></span>
        <span>Online <strong>${esc(dash.summary.online)}/${esc(dash.summary.total)}</strong></span>
        <span>Sim <strong>${esc(dash.summary.simulating)}</strong></span>
        <span class="${data.mysql ? "ok" : "bad"}">MySQL <strong>${data.mysql ? "on" : "off"}</strong></span>
      `;
      const root = document.getElementById("devices");
      const list = dash.devices || [];
      if (!list.length) {
        root.innerHTML = `<div class="empty">No devices seeded</div>`;
        return;
      }

      captureAllDrafts();
      const byId = new Map(list.map((d) => [d.id, d]));
      const existing = [...root.querySelectorAll(".card[data-id]")];

      if (full || existing.length === 0 || existing.length !== list.length) {
        root.innerHTML = list.map(card).join("");
        return;
      }

      for (const cardEl of existing) {
        const d = byId.get(cardEl.dataset.id);
        if (!d) {
          cardEl.remove();
          continue;
        }
        patchCard(cardEl, d);
      }
    }

    async function saveSimConfig(cardEl, { on, saveOnly } = {}) {
      const id = cardEl.dataset.id;
      const body = {
        profile: cardEl.querySelector(".inp-profile").value,
        hz: Number(cardEl.querySelector(".inp-hz").value) || 1,
      };
      if (saveOnly) body.saveOnly = true;
      else body.on = on;
      await api(`/api/admin/devices/${encodeURIComponent(id)}/sim`, {
        method: "POST",
        body: JSON.stringify(body),
      });
      drafts.set(id, {
        ...drafts.get(id),
        profile: body.profile,
        hz: body.hz,
        editing: false,
      });
    }

    document.getElementById("devices").addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button[data-act]");
      if (!btn) return;
      const cardEl = btn.closest(".card");
      const id = cardEl.dataset.id;
      const act = btn.dataset.act;
      btn.disabled = true;
      try {
        if (act === "rename") {
          const label = cardEl.querySelector(".inp-label").value.trim();
          await api(`/api/admin/devices/${encodeURIComponent(id)}/rename`, {
            method: "POST",
            body: JSON.stringify({ label }),
          });
          drafts.set(id, { ...drafts.get(id), label, editing: false });
        } else if (act === "role") {
          const role = cardEl.querySelector(".inp-role").value.trim();
          await api(`/api/admin/devices/${encodeURIComponent(id)}/role`, {
            method: "POST",
            body: JSON.stringify({ role }),
          });
          drafts.set(id, { ...drafts.get(id), role, editing: false });
        } else if (act === "sim-toggle") {
          const on = !btn.classList.contains("on");
          await saveSimConfig(cardEl, { on });
        } else if (act === "clear") {
          await api(`/api/admin/devices/${encodeURIComponent(id)}/clear`, {
            method: "POST",
            body: "{}",
          });
        } else if (act === "sim-reset") {
          await api(`/api/admin/devices/${encodeURIComponent(id)}/sim-reset`, {
            method: "POST",
            body: "{}",
          });
          drafts.delete(id);
        } else if (act === "sos-off") {
          await api(`/api/admin/devices/${encodeURIComponent(id)}/sos`, {
            method: "POST",
            body: JSON.stringify({ active: false }),
          });
        } else if (act === "emulate") {
          const keys = [
            "hr","spo2","temp","battery","mass","gripStrength","acceleration",
            "movement","activity","pressure","airTemperature","airOxygen","airQuality",
            "co2","radiation","radiationDose","sleepDuration","sleepQuality","stressLevel"
          ];
          const metrics = {};
          for (const k of keys) {
            const el = cardEl.querySelector(`.emu-${k}`);
            if (!el) continue;
            const raw = el.value.trim();
            if (raw === "") continue;
            metrics[k] = raw;
          }
          await api(`/api/admin/devices/${encodeURIComponent(id)}/emulate`, {
            method: "POST",
            body: JSON.stringify({ metrics }),
          });
        } else if (act === "emulate-clear") {
          await api(`/api/admin/devices/${encodeURIComponent(id)}/emulate-clear`, {
            method: "POST",
            body: "{}",
          });
        } else if (act === "medical") {
          const g = (k) => cardEl.querySelector(`.emu-${k}`)?.value?.trim() || "";
          const height = g("med-height");
          const mass = g("med-mass");
          const pulse = g("med-pulse");
          const oxygen = g("med-spo2");
          const medicalCard = {
            personal: {
              name: g("med-name"),
              birthDate: g("med-birth"),
              sex: g("med-sex"),
              bloodType: g("med-blood"),
            },
            physical: {
              height: height === "" ? null : Number(height),
              mass: mass === "" ? null : Number(mass),
              pulse: pulse === "" ? null : Number(pulse),
              oxygen: oxygen === "" ? null : Number(oxygen),
            },
            medicalHistory: {
              allergies: g("med-allergies"),
              medications: g("med-meds"),
            },
            assessment: {
              notes: g("med-notes"),
            },
          };
          const baseline = {
            pulse: medicalCard.physical.pulse,
            oxygen: medicalCard.physical.oxygen,
            mass: medicalCard.physical.mass,
          };
          await api(`/api/admin/devices/${encodeURIComponent(id)}/medical`, {
            method: "POST",
            body: JSON.stringify({ medicalCard, baseline }),
          });
        } else if (act === "checkin") {
          const mood = cardEl.querySelector(".emu-ci-mood")?.value?.trim() || "Neutral";
          const symptoms = cardEl.querySelector(".emu-ci-symptoms")?.value?.trim() || "";
          await api(`/api/admin/devices/${encodeURIComponent(id)}/checkin`, {
            method: "POST",
            body: JSON.stringify({ mood, symptoms }),
          });
        }
        await load({ full: act === "sim-reset" || act === "emulate" || act === "emulate-clear" || act === "medical" });
      } catch (e) {
        alert(e.message);
        btn.disabled = false;
      }
    });

    // Зміна profile/Hz одразу зберігається на сервері (і застосовується, якщо sim увімкнено)
    document.getElementById("devices").addEventListener("change", async (ev) => {
      const el = ev.target;
      if (!el.matches(".inp-profile, .inp-hz")) return;
      const cardEl = el.closest(".card");
      if (!cardEl) return;
      try {
        const running = cardEl.querySelector('[data-act="sim-toggle"]')?.classList.contains("on");
        if (running) await saveSimConfig(cardEl, { on: true });
        else await saveSimConfig(cardEl, { saveOnly: true });
        await load();
      } catch (e) {
        alert(e.message);
      }
    });

    document.getElementById("btn-refresh").onclick = () =>
      load({ full: true }).catch((e) => alert(e.message));
    document.getElementById("btn-stop-all").onclick = async () => {
      await api("/api/admin/sim/stop-all", { method: "POST", body: "{}" });
      await load();
    };
    document.getElementById("btn-reset-all").onclick = async () => {
      if (!confirm("Stop all sims and clear saved profiles/Hz?")) return;
      await api("/api/admin/sim/reset-all", { method: "POST", body: "{}" });
      drafts.clear();
      await load({ full: true });
    };

    load({ full: true }).catch((e) => {
      document.getElementById("devices").innerHTML =
        `<div class="empty">Cannot reach server: ${esc(e.message)}</div>`;
    });
    // Автооновлення лише метрик — не перемальовує всю форму
    setInterval(() => load().catch(() => {}), 3000);
  </script>
</body>
</html>
