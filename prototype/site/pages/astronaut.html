
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PULSAR | Astronaut Monitoring</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/astronaut.css">

</head>

<body>

    <!-- ==========================================
         ВЕРХНЯ ПАНЕЛЬ
    =========================================== -->

    <header class="header">

        <a class="brand" href="../index.html">

            <svg class="logo" viewBox="0 0 48 48">

                <circle cx="24" cy="24" r="19"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"/>

                <path d="M2 24 H13 L18 15 L24 35
                         L30 9 L35 24 H46"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.5"
                      stroke-linejoin="round"/>

            </svg>

            <div>

                <h1>PULSAR</h1>

                <p>Space Crew Health Monitoring</p>

            </div>

        </a>


        <!-- Назва космічної місії -->

        <div class="mission">
            Lunar Exploration Mission
        </div>

        <div class="header-live">
            <span id="link-chip" class="link-chip" data-state="offline">Offline</span>
            <span id="utc-clock" class="utc-clock"></span>
        </div>

    </header>


    <!-- ==========================================
         ІНДИВІДУАЛЬНА ПАНЕЛЬ АСТРОНАВТА
    =========================================== -->

    <div class="astronaut-layout">


        <!-- ======================================
             БОКОВЕ МЕНЮ
        ======================================= -->

        <aside class="sidebar">


            <!-- Повернення до головної сторінки -->

            <a href="../index.html"
               class="back-button">

                ← Back to crew

            </a>


            <!-- ==================================
                 ІНФОРМАЦІЯ ПРО АСТРОНАВТА
            =================================== -->

            <div class="sidebar-profile">


                <!-- Аватар -->

                <div class="profile-avatar"
                     id="profile-avatar">

                    —

                </div>


                <!-- Ім'я -->

                <h2 id="profile-name">

                    Loading...

                </h2>


                <!-- Роль в екіпажі -->

                <p id="profile-role"></p>


                <!-- Ідентифікатор -->

                <span id="profile-id"></span>


                <!-- Поточний статус -->

                <span id="profile-status"
                      class="status">

                </span>

            </div>


            <!-- ==================================
                 НАВІГАЦІЯ МІЖ РОЗДІЛАМИ
            =================================== -->

            <nav class="sidebar-navigation"
                 aria-label="Astronaut monitoring">


                <!-- ==================================
                     HEALTH MONITORING
                     Моніторинг здоров'я
                =================================== -->

                <button type="button"
                        class="nav-button active"
                        data-section="health">

                    <span class="nav-icon"
                          aria-hidden="true">

                        ♡

                    </span>

                    Health Monitoring

                </button>


                <!-- ==================================
                     ENVIRONMENT
                     Навколишнє середовище
                =================================== -->

                <button type="button"
                        class="nav-button"
                        data-section="environment">

                    <span class="nav-icon"
                          aria-hidden="true">

                        ◎

                    </span>

                    Environment

                </button>


                <!-- ==================================
                     ANALYTICS
                     Аналітика та історія вимірювань
                =================================== -->

                <button type="button"
                        class="nav-button"
                        data-section="analytics">

                    <span class="nav-icon"
                          aria-hidden="true">

                        ▥

                    </span>

                    Analytics

                </button>


                <!-- ==================================
                     AI HEALTH INSIGHTS
                     Раннє виявлення тенденцій
                =================================== -->

                <button type="button"
                        class="nav-button"
                        data-section="insights">

                    <span class="nav-icon"
                          aria-hidden="true">

                        ✧

                    </span>

                    AI Health Insights

                </button>


                <!-- ==================================
                     HEALTH GUIDE
                     Медична довідкова інформація
                =================================== -->

                <button type="button"
                        class="nav-button"
                        data-section="guide">

                    <span class="nav-icon"
                          aria-hidden="true">

                        ▤

                    </span>

                    Health Guide

                </button>


                <!-- ==================================
                     SETTINGS
                     Медична картка та налаштування
                =================================== -->

                <button type="button"
                        class="nav-button"
                        data-section="settings">

                    <span class="nav-icon"
                          aria-hidden="true">

                        ⚙

                    </span>

                    Settings

                </button>

            </nav>


            <!-- ==================================
                 SOS / EMERGENCY
                 Кнопка екстреної допомоги
            =================================== -->

            <button type="button"
                    class="sidebar-sos"
                    id="sidebar-sos">

                SOS / Emergency

            </button>

        </aside>


        <!-- ======================================
             ОСНОВНА ЧАСТИНА СТОРІНКИ
        ======================================= -->

        <main class="astronaut-main">


            <!-- Заголовок поточного розділу -->

            <div class="section-heading">

                <div>

                    <h2 id="section-title">

                        Health Monitoring

                    </h2>

                    <p id="section-description">

                        Physical health and daily well-being

                    </p>

                </div>


                <!-- Демонстраційний режим -->

                <span class="demo-label">

                    LIVE

                </span>

            </div>


            <!-- ==================================
                 ДИНАМІЧНИЙ ВМІСТ РОЗДІЛУ
            =================================== -->

            <div id="section-content">

                <!--
                    Вміст створюється автоматично
                    через astronaut.js.

                    Доступні розділи:

                    1. Health Monitoring
                    2. Environment
                    3. Analytics
                    4. AI Health Insights
                    5. Health Guide
                    6. Settings
                -->

            </div>

        </main>

    </div>


    <!-- ==========================================
         НИЖНЯ ЧАСТИНА САЙТУ
    =========================================== -->

    <footer>

        PULSAR © 2026 |
        Individual Monitoring |
        Live · server :4100

    </footer>


    <!-- ==========================================
         ПІДКЛЮЧЕННЯ JAVASCRIPT-ФАЙЛІВ
    =========================================== -->


    <!-- ==========================================
         NOTIFICATION CENTER
         Спільний центр сповіщень екіпажу
    =========================================== -->

    <script>
      window.PULSAR_API = window.PULSAR_API || "http://127.0.0.1:4100";
    </script>
    <script src="../js/live.js"></script>
    <script src="../js/notifications.js"></script>


    <!-- ==========================================
         SOS SYSTEM
         Система екстреної допомоги
    =========================================== -->

    <script src="../js/sos.js"></script>


    <!-- ==========================================
         HEALTH GUIDE
         Медична довідкова інформація
    =========================================== -->

    <script src="../js/guide.js"></script>


    <!-- ==========================================
         AI HEALTH INSIGHTS
         Аналіз тенденцій та раннє виявлення
    =========================================== -->

    <script src="../js/insights.js"></script>


    <!-- ==========================================
         ASTRONAUT MONITORING
         Основна логіка індивідуальної панелі
    =========================================== -->

    <script src="../js/astronaut.js"></script>

</body>

</html>
